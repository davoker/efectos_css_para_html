<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texto líquido metálico — efecto WebGL (MERCURIO)</title>
<style>
  html, body { margin:0; height:100%; background:#05060a; overflow:hidden;
    font-family:"Segoe UI", system-ui, sans-serif; color:#9fb4d0; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; left:0; right:0; bottom:26px; display:flex; flex-direction:column;
        align-items:center; gap:10px; pointer-events:none; }
  #txt { pointer-events:auto; width:min(560px,84vw); text-align:center; font-size:17px;
        padding:12px 18px; border-radius:999px; color:#e8f1ff; letter-spacing:.16em;
        background:rgba(10,14,24,.55); border:1px solid rgba(140,180,255,.28);
        outline:none; backdrop-filter:blur(6px); text-transform:uppercase; }
  #txt:focus { border-color:rgba(160,220,255,.6); box-shadow:0 0 0 3px rgba(80,160,255,.15); }
  .hint { margin:0; font-size:12.5px; letter-spacing:.06em; opacity:.7; text-align:center;
          padding:0 16px; }
  .err { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:40px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <input id="txt" value="MERCURIO" spellcheck="false" maxlength="24" autocomplete="off">
  <p class="hint">mueve el ratón sobre el texto &middot; clic para lanzar una onda &middot; escribe para cambiar la palabra</p>
</div>
<div class="err" id="err"><p>Este navegador no soporta WebGL, así que el efecto no puede mostrarse.</p></div>
<script>
(function(){
"use strict";

var cv  = document.getElementById('gl');
var err = document.getElementById('err');
var gl  = cv.getContext('webgl', {antialias:false, alpha:false, depth:false})
       || cv.getContext('experimental-webgl', {antialias:false, alpha:false, depth:false});
if (!gl) { err.style.display = 'grid'; return; }

/* ---------------------------------------------------------------- shaders */

var VS = [
'attribute vec2 aPos;',
'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
].join('\n');

var FS = [
'#ifdef GL_FRAGMENT_PRECISION_HIGH',
'precision highp float;',
'#else',
'precision mediump float;',
'#endif',
'',
'uniform vec2  uRes;',
'uniform float uTime;',
'uniform sampler2D uText;',
'uniform sampler2D uBlur;',
'uniform vec2  uPlane;',
'uniform vec2  uTexel;',
'uniform vec2  uMouse;',
'uniform vec2  uClickPos;',
'uniform float uAmp;',
'uniform float uClickT;',
'',
'float hash21(vec2 p){',
'  p = fract(p * vec2(123.34, 456.21));',
'  p += dot(p, p + 45.32);',
'  return fract(p.x * p.y);',
'}',
'float vnoise(vec2 p){',
'  vec2 i = floor(p), f = fract(p);',
'  vec2 u = f * f * (3.0 - 2.0 * f);',
'  float a = hash21(i);',
'  float b = hash21(i + vec2(1.0, 0.0));',
'  float c = hash21(i + vec2(0.0, 1.0));',
'  float d = hash21(i + vec2(1.0, 1.0));',
'  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
'}',
'float fbm(vec2 p){',
'  float v = 0.0, a = 0.5;',
'  for (int i = 0; i < 5; i++){',
'    v += a * vnoise(p);',
'    p = p * 2.03 + vec2(1.7, 9.2);',
'    a *= 0.5;',
'  }',
'  return v;',
'}',
'',
'/* version suave, solo para el desplazamiento: bordes sin aspecto desmenuzado */',
'float fbm3(vec2 p){',
'  float v = 0.0, a = 0.60;',
'  for (int i = 0; i < 3; i++){',
'    v += a * vnoise(p);',
'    p = p * 2.03 + vec2(1.7, 9.2);',
'    a *= 0.45;',
'  }',
'  return v;',
'}',
'',
'vec3 bgCol(vec2 p, float t){',
'  float r = length(p * vec2(0.75, 1.0));',
'  vec3 col = mix(vec3(0.055, 0.075, 0.115), vec3(0.012, 0.014, 0.028),',
'                 smoothstep(0.05, 1.05, r));',
'  vec2 b1 = vec2(0.42 * sin(t * 0.27 + 1.0), 0.30 * cos(t * 0.21));',
'  col += vec3(0.17, 0.05, 0.30) * exp(-5.5 * dot(p - b1, p - b1));',
'  vec2 b2 = vec2(-0.45 * cos(t * 0.18), -0.32 * sin(t * 0.25 + 2.0));',
'  col += vec3(0.03, 0.20, 0.27) * exp(-6.5 * dot(p - b2, p - b2));',
'  col += vec3(0.24, 0.15, 0.05) * exp(-9.0 * dot(p, p)) * (0.60 + 0.40 * sin(t * 0.5));',
'  col += 0.018 * sin(p.y * 46.0 + t * 1.2);',
'  return col;',
'}',
'',
'/* entorno de estudio para la reflexion del metal: horizonte + bandas + manchas */',
'vec3 envCol(vec2 p, float t){',
'  vec3 c = mix(vec3(0.02, 0.025, 0.05), vec3(0.42, 0.48, 0.65),',
'               smoothstep(-0.50, 0.75, p.y + 0.18 * sin(p.x * 2.4 + t * 0.3)));',
'  float s = 0.5 + 0.5 * sin(p.y * 18.0 + p.x * 3.0 - t * 0.9);',
'  c += vec3(0.75, 0.80, 0.95) * pow(s, 7.0) * 1.10;',
'  float hz = p.y - 0.30 + 0.08 * sin(p.x * 3.0 + t * 0.4);',
'  c += vec3(0.95, 0.97, 1.00) * exp(-90.0 * hz * hz);',
'  float hz2 = p.y + 0.34;',
'  c += vec3(0.20, 0.45, 0.75) * exp(-55.0 * hz2 * hz2) * 0.80;',
'  c += vec3(0.28, 0.10, 0.45) * exp(-6.0 * dot(p - vec2(0.30, 0.20), p - vec2(0.30, 0.20)));',
'  c += vec3(0.05, 0.32, 0.42) * exp(-6.0 * dot(p + vec2(0.35, 0.25), p + vec2(0.35, 0.25)));',
'  return c;',
'}',
'',
'void main(){',
'  float t = uTime;',
'  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;',
'',
'  vec2 tuv = 0.5 + p / (2.0 * uPlane);',
'  float inPlane = step(0.0, tuv.x) * step(tuv.x, 1.0) * step(0.0, tuv.y) * step(tuv.y, 1.0);',
'',
'  /* -- flujo liquido: fbm con domain warp -- */',
'  vec2 sp = tuv;',
'  vec2 q = vec2(fbm(sp * 2.4 + vec2(0.0, t * 0.18)),',
'                fbm(sp * 2.4 + vec2(5.2, 1.3) - t * 0.15));',
'  vec2 r = vec2(fbm(sp * 3.5 + 3.5 * q + t * 0.22),',
'                fbm(sp * 3.5 + 3.5 * q + vec2(1.7, 9.2) + t * 0.19));',
'  float flow = fbm(sp * 2.4 + 3.0 * r);',
'  vec2 w = (q - 0.5) * 0.7 + (r - 0.5) * 0.5;',
'  float fd = fbm3(sp * 2.2 + w * 2.2) - 0.5;',
'',
'  /* -- onda del raton + pulso del clic -- */',
'  vec2 dm = p - uMouse;',
'  float md = length(dm);',
'  float wave = sin(md * 36.0 - t * 7.0) * exp(-md * 6.0) * uAmp;',
'',
'  vec2 dc = p - uClickPos;',
'  float cd = length(dc);',
'  float age = max(t - uClickT, 0.0);',
'  float ring = exp(-pow((cd - age * 0.85) * 7.0, 2.0)) * exp(-age * 1.8);',
'',
'  vec2 dirM = dm / max(md, 1e-4);',
'  vec2 dirC = dc / max(cd, 1e-4);',
'  vec2 push = dirM * wave * 0.020 + dirC * ring * 0.050;',
'',
'  vec2 duv = tuv + vec2(fd, fd * 0.65) * 0.008 + push / (2.0 * uPlane);',
'  vec2 cuv = clamp(duv, 0.0, 1.0);',
'',
'  float mask = texture2D(uText, cuv).a * inPlane;',
'  float hb   = texture2D(uBlur, cuv).a * inPlane;',
'',
'  /* -- normal a partir del mapa de altura difuminado -- */',
'  float hL = texture2D(uBlur, clamp(cuv - vec2(uTexel.x, 0.0), 0.0, 1.0)).a;',
'  float hR = texture2D(uBlur, clamp(cuv + vec2(uTexel.x, 0.0), 0.0, 1.0)).a;',
'  float hD = texture2D(uBlur, clamp(cuv - vec2(0.0, uTexel.y), 0.0, 1.0)).a;',
'  float hU = texture2D(uBlur, clamp(cuv + vec2(0.0, uTexel.y), 0.0, 1.0)).a;',
'  vec3 N = normalize(vec3((hL - hR) * 3.2, (hD - hU) * 3.2, 0.35));',
'',
'  /* -- brillo liquido de alta frecuencia dentro de las letras -- */',
'  float s1 = vnoise(sp * 15.0 + vec2(t * 0.9, -t * 0.7));',
'  float s2 = vnoise(sp * 15.0 + vec2(-t * 0.8, t * 0.6) + 7.3);',
'  N.xy += (vec2(s1, s2) - 0.5) * 0.20 * hb;',
'  N = normalize(N);',
'',
'  /* -- fondo, refraccion, reflexion -- */',
'  vec3 base  = bgCol(p, t);',
'  vec3 refr  = bgCol(p + N.xy * 0.35 * hb, t);',
'',
'  vec3 Lauto   = normalize(vec3(cos(t * 0.5) * 0.55, sin(t * 0.42) * 0.42 + 0.2, 0.72));',
'  vec3 Lmouse  = normalize(vec3(uMouse * 1.8, 0.75));',
'  vec3 L       = normalize(mix(Lauto, Lmouse, clamp(uAmp, 0.0, 1.0)));',
'  vec3 V       = vec3(0.0, 0.0, 1.0);',
'  vec3 Hv      = normalize(L + V);',
'  float diff   = max(dot(N, L), 0.0);',
'  float spec   = pow(max(dot(N, Hv), 0.0), 90.0);',
'  float spec2  = pow(max(dot(N, Hv), 0.0), 9.0);',
'  float fres   = pow(1.0 - max(dot(N, V), 0.0), 2.6);',
'',
'  vec3 R   = reflect(-V, N);',
'  vec3 env = pow(max(envCol(p + R.xy * 1.10, t), 0.0), vec3(1.6)) * 1.9;',
'',
'  vec3 metal = mix(refr, env, 0.85) * vec3(0.84, 0.89, 1.00);',
'  metal += vec3(0.03, 0.035, 0.05);',
'  metal += vec3(0.08, 0.10, 0.14) * diff;',
'  metal += env * fres * 0.45;',
'  metal += vec3(0.10, 0.12, 0.16) * smoothstep(0.35, 0.65, flow) * hb;',
'  float rim = pow(clamp(hb * (1.0 - hb) * 2.0, 0.0, 1.0), 2.0);',
'  metal += vec3(0.35, 0.60, 1.00) * rim * 0.45;',
'  metal += vec3(1.0, 0.97, 0.92) * spec * 1.10;',
'  metal += vec3(0.60, 0.70, 0.90) * spec2 * 0.10;',
'',
'  vec3 col = mix(base, metal, mask);',
'',
'  /* -- separacion cromatica en los bordes -- */',
'  float o  = 0.005 + 0.012 * length(N.xy);',
'  float mr = texture2D(uText, clamp(duv + N.xy * o, 0.0, 1.0)).a;',
'  float mb = texture2D(uText, clamp(duv - N.xy * o, 0.0, 1.0)).a;',
'  col += vec3(0.95, 0.15, 0.60) * (mr - mask) * 0.45;',
'  col += vec3(0.10, 0.50, 0.95) * (mb - mask) * 0.45;',
'',
'  /* -- halo y pulso -- */',
'  float halo = smoothstep(0.05, 0.55, hb) * (1.0 - mask);',
'  col += vec3(0.20, 0.45, 0.78) * halo * halo * 0.35;',
'  col += vec3(0.35, 0.65, 1.00) * ring * 0.30;',
'',
'  /* -- viñeta + grano -- */',
'  col *= 1.0 - 0.45 * smoothstep(0.45, 1.15, length(p * vec2(0.7, 1.0)));',
'  col += (hash21(gl_FragCoord.xy + fract(t) * 13.7) - 0.5) * 0.012;',
'  col = vec3(1.0) - exp(-max(col, 0.0) * 1.30);   /* tono filmico: evita quemar los brillos */',
'  col = pow(col, vec3(0.95));',
'',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

var vs = compile(gl.VERTEX_SHADER, VS);
var fs = compile(gl.FRAGMENT_SHADER, FS);
if (!vs || !fs) { err.style.display = 'grid'; err.firstElementChild.textContent = 'Error al compilar los shaders.'; return; }

var prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.bindAttribLocation(prog, 0, 'aPos');
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
  err.style.display = 'grid';
  return;
}
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

var U = {};
['uRes','uTime','uText','uBlur','uPlane','uTexel','uMouse','uClickPos','uAmp','uClickT']
  .forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });

function newTex(){
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}
var texText = newTex();
var texBlur = newTex();
// el lienzo 2D crece hacia abajo y el lienzo GL hacia arriba: hay que voltearlo
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

/* ------------------------------------------------------- textura del texto */

var planeAspect = 4.0;   // W/H del lienzo de texto
var texel = [1/1024, 1/256];

function fontFor(size){
  return '900 ' + size + 'px "Arial Black", "Segoe UI Black", Impact, system-ui, sans-serif';
}

function buildText(str){
  str = (str || '').replace(/\s+/g, ' ').trim();
  if (!str) str = 'MERCURIO';
  str = str.toUpperCase();

  var probe = document.createElement('canvas').getContext('2d');
  var size = 320, tw = 0, pad = 0;

  for (var k = 0; k < 4; k++){
    probe.font = fontFor(size);
    tw = probe.measureText(str).width;
    pad = Math.round(size * 0.35);
    if (tw + pad * 2 <= 2048) break;
    size = Math.max(48, Math.floor(size * (2048 - pad * 2) / (tw + pad * 2)));
  }

  var W = Math.ceil(tw) + pad * 2;
  var H = Math.ceil(size * 1.30) + pad * 2;
  var baseline = pad + size * 0.98;   // aproximacion de mayusculas centradas

  // -- lienzo nítido (máscara)
  var sharp = document.createElement('canvas');
  sharp.width = W; sharp.height = H;
  var sc = sharp.getContext('2d');
  sc.font = fontFor(size);
  sc.textAlign = 'center';
  sc.textBaseline = 'alphabetic';
  sc.fillStyle = '#fff';
  sc.fillText(str, W / 2, baseline);

  // -- lienzo difuminado (mapa de altura para el biselado)
  var blur = document.createElement('canvas');
  blur.width = W; blur.height = H;
  var bc = blur.getContext('2d');
  bc.font = fontFor(size);
  bc.textAlign = 'center';
  bc.textBaseline = 'alphabetic';
  bc.fillStyle = '#fff';

  var radius = Math.max(4, Math.round(size * 0.06));
  if (typeof bc.filter === 'string') {
    bc.filter = 'blur(' + radius + 'px)';
    bc.fillText(str, W / 2, baseline);
    bc.filter = 'none';
  } else {
    // alternativa sin filter: varias copias desplazadas
    bc.globalAlpha = 0.30;
    bc.fillText(str, W / 2, baseline);
    for (var i = 0; i < 8; i++){
      var a = i / 8 * Math.PI * 2;
      bc.fillText(str, W / 2 + Math.cos(a) * radius, baseline + Math.sin(a) * radius);
    }
    bc.globalAlpha = 1;
  }

  gl.bindTexture(gl.TEXTURE_2D, texText);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sharp);
  gl.bindTexture(gl.TEXTURE_2D, texBlur);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, blur);

  planeAspect = W / H;
  texel = [1 / W, 1 / H];
  updatePlane();
}

/* ------------------------------------------------------------- geometría */

var plane = [0.5, 0.125];

function updatePlane(){
  var asp = cv.width / Math.max(cv.height, 1);
  var availX = 0.5 * asp - 0.04;
  var h = Math.min(availX / planeAspect, 0.42);
  plane = [h * planeAspect, h];
}

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(1, Math.floor(cv.clientWidth * dpr));
  var hh = Math.max(1, Math.floor(cv.clientHeight * dpr));
  if (cv.width !== w || cv.height !== hh){
    cv.width = w; cv.height = hh;
    gl.viewport(0, 0, w, hh);
  }
  updatePlane();
}
window.addEventListener('resize', resize);

/* ----------------------------------------------------------- interacción */

var mouse = [0, 0];
var clickPos = [0, 0];
var clickT = -10000;
var amp = 0, ampTarget = 0;
var lastMove = -1e9;

function toScene(x, y){
  var w = window.innerWidth, h = window.innerHeight;
  return [(x - w / 2) / h, (h / 2 - y) / h];
}

window.addEventListener('pointermove', function(e){
  mouse = toScene(e.clientX, e.clientY);
  lastMove = performance.now();
  ampTarget = 1;
}, {passive:true});

window.addEventListener('pointerdown', function(e){
  clickPos = toScene(e.clientX, e.clientY);
  mouse = clickPos;
  clickT = tSec;
  lastMove = performance.now();
  ampTarget = 1;
}, {passive:true});

var input = document.getElementById('txt');
var pending = null;
input.addEventListener('input', function(){
  pending = input.value;
});
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
});

// modo demo (?demo=1): recorre el ratón solo, para verlo sin mover el punter
var demo = /[?&]demo=1/.test(location.search);

// texto inicial por URL (?t=EFECTOS)
var mText = /[?&]t=([^&]+)/.exec(location.search);
if (mText) {
  try {
    var v0 = decodeURIComponent(mText[1].replace(/\+/g, ' '));
    if (v0) { input.value = v0; input.setAttribute('value', v0); }
  } catch (e) {}
}

/* ------------------------------------------------------------------ bucle */

var t0 = performance.now();
var tSec = 0;
var pendingBuilt = false;

function frame(now){
  tSec = (now - t0) / 1000;
  resize();

  if (pending !== null && !pendingBuilt){
    pendingBuilt = true;
    var v = pending; pending = null;
    buildText(v);
    pendingBuilt = false;
  }

  if (now - lastMove > 2600) ampTarget = 0;
  amp += (ampTarget - amp) * 0.07;

  if (demo){
    mouse = [0.30 * Math.sin(tSec * 0.8), 0.16 * Math.cos(tSec * 0.6)];
    ampTarget = 1;
    amp = 1;
  }

  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uTime, tSec);
  gl.uniform2f(U.uPlane, plane[0], plane[1]);
  gl.uniform2f(U.uTexel, texel[0], texel[1]);
  gl.uniform2f(U.uMouse, mouse[0], mouse[1]);
  gl.uniform2f(U.uClickPos, clickPos[0], clickPos[1]);
  gl.uniform1f(U.uAmp, amp);
  gl.uniform1f(U.uClickT, clickT);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texText);
  gl.uniform1i(U.uText, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texBlur);
  gl.uniform1i(U.uBlur, 1);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

gl.uniform1i(U.uText, 0);
gl.uniform1i(U.uBlur, 1);
resize();
buildText(input.value);
requestAnimationFrame(frame);

window.__textoListo = true;
})();
</script>
</body>
</html>
